# FAUCET METERS & ACLS
meters:
  guest_limit:
    meter_id: 1
    entry:
      flags: [KBPS, BURST]
      bands:
        - type: DROP
          rate: 10000
          burst_size: 1200

acls:
  # ==========================================================
  # 1. MANAGEMENT PORT SECURITY & ISOLATIE (hB2)
  # ==========================================================
  mgmt_portsec:
    # L2 ARP en ICMPv6 NDP toestaan voor whitelisted MAC
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # Volledige isolatie: Management mag niet naar Gast of Employee
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 10.10.0.0/22
        actions:
          allow: 0
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 10.20.0.0/22
        actions:
          allow: 0
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:10::/64
        actions:
          allow: 0
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::/64
        actions:
          allow: 0

    # IPv6 Stateful Tracking voor uitgaand verkeer naar WAN
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ct_state: 0x21/0x21
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # IPv4 NAPT naar ISP A
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 203.0.113.1
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.2
              range_ipv4_max: 203.0.113.2

    # IPv4 NAPT naar ISP B
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 203.0.113.17
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.18
              range_ipv4_max: 203.0.113.18

    # Overig valide verkeer binnen eigen VLAN 30 doorlaten
    - rule:
        eth_src: "00:00:00:00:00:05"
        actions:
          allow: 1

    # Port Security: Blokkeer elk ander MAC-adres op poort 2
    - rule:
        actions:
          allow: 0

  # ==========================================================
  # 2. GASTENBEVEILIGING (Isolatie + Rate Limit + Conntrack)
  # ==========================================================
  guest_isolation:
    # ARP en ICMPv6 NDP toestaan
    - rule:
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # Gateways (VIPs) toestaan
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.20.0.254
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::fe
        actions:
          allow: 1

    # Isolatie: Blokkeer onderling verkeer en interne subnets
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.20.0.0/22
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::/64
        actions:
          allow: 0
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.10.0.0/22
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:10::/64
        actions:
          allow: 0
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.30.0.0/24
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:30::/64
        actions:
          allow: 0

    # IPv6 Stateful Tracking + Rate Limiting naar WAN
    - rule:
        eth_type: 0x86dd
        ct_state: 0/0x20
        actions:
          meter: guest_limit
          ct:
            zone: 1
            table: 0
    - rule:
        eth_type: 0x86dd
        ct_state: 0x21/0x21
        actions:
          meter: guest_limit
          ct:
            zone: 1
            flags: 1
            table: 1
    - rule:
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          meter: guest_limit
          allow: 1

    # IPv4 NAPT + Rate Limiting naar ISP A
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.1
        actions:
          meter: guest_limit
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.2
              range_ipv4_max: 203.0.113.2

    # IPv4 NAPT + Rate Limiting naar ISP B
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.17
        actions:
          meter: guest_limit
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.18
              range_ipv4_max: 203.0.113.18

    # Fallback drop voor overig verkeer
    - rule:
        actions:
          allow: 0

  # ==========================================================
  # 3. INTERNE NAT & SCHEIDING (Employee poorten)
  # ==========================================================
  NAT:
    # ARP en NDP altijd doorlaten
    - rule:
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # Strikt blokkeren naar Beheer (VLAN 30) en Gasten (VLAN 20)
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.30.0.0/24
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:30::/64
        actions:
          allow: 0
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.20.0.0/22
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::/64
        actions:
          allow: 0

    # Lokaal inter-host verkeer binnen Employee (VLAN 10) toestaan
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.10.0.0/22
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:10::/64
        actions:
          allow: 1

    # IPv6 Stateful Conntrack Tracking naar WAN (geen bypass meer!)
    - rule:
        eth_type: 0x86dd
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0
    - rule:
        eth_type: 0x86dd
        ct_state: 0x21/0x21
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
    - rule:
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # IPv4 Conntrack tracking
    - rule:
        eth_type: 0x0800
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0

    # IPv4 NAPT naar ISP A
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.1
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.2
              range_ipv4_max: 203.0.113.2

    # IPv4 NAPT naar ISP B
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.17
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.18
              range_ipv4_max: 203.0.113.18

    # Terugkerend verkeer de-natten
    - rule:
        eth_type: 0x0800
        ct_zone: 1
        ct_state: 0x22/0x22
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1

  # ==========================================================
  # 4. STATEFUL WAN FIREWALL (Uplinks op sA0/sB0)
  # ==========================================================
  wan_firewall:
    # Peering ARP en NDP doorlaten
    - rule:
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # IPv6 Inkomend: Conntrack sessiecontrole
    - rule:
        eth_type: 0x86dd
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0

    # IPv6 Inkomend: Alleen antwoorden op legitieme uitgaande sessies toelaten (TCP, UDP, ICMP)
    - rule:
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # IPv6 Inkomend: Echo reply expliciet
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 129
        actions:
          allow: 1

    # IPv6: Blokkeer alle ongevraagde inkomende verbindingen
    - rule:
        eth_type: 0x86dd
        actions:
          allow: 0

    # IPv4 Inkomend: Conntrack de-natting
    - rule:
        eth_type: 0x0800
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 1
            nat: {}

    # IPv4: Alleen antwoordverkeer doorlaten
    - rule:
        eth_type: 0x0800
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # IPv4: Blokkeer ongevraagd verkeer
    - rule:
        eth_type: 0x0800
        actions:
          allow: 0
