# FAUCET METERS & ACLS
meters:
  guest_limit:
    meter_id: 1
    entry:
      flags: [KBPS, BURST]
      bands:
        - type: DROP
          rate: 10000
          burst_size: 500000

acls:
  # ==========================================================
  # 1. MANAGEMENT PORT SECURITY (L2 whitelist + L3 Transit)
  # ==========================================================
  mgmt_portsec:
    # L2 ARP en ICMPv6 NDP toestaan voor gevalideerd MAC
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # Inter-VLAN verkeer (intern IPv4 en IPv6) routeren voor hB2
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 10.0.0.0/8
        actions:
          allow: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ipv6_dst: 2001:db8::/32
        actions:
          allow: 1

    # Uitgaand IPv4 naar ISP A natten
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 203.0.113.1
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.2
              range_ipv4_max: 203.0.113.2

    # Uitgaand IPv4 naar ISP B natten
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 203.0.113.17
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.18
              range_ipv4_max: 203.0.113.18

    # Overig gevalideerd verkeer van hB2 doorlaten
    - rule:
        eth_src: "00:00:00:00:00:05"
        actions:
          allow: 1

    # Blokkeer alle ongeautoriseerde MAC-adressen op poort 2
    - rule:
        actions:
          allow: 0

  # ==========================================================
  # 2. GASTENBEVEILIGING (Isolatie + Rate Limit + NAT)
  # ==========================================================
  guest_isolation:
    # ARP en ICMPv6 NDP toestaan
    - rule:
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # Gateways (Faucet VIPs) expliciet toestaan voor L3 discovery
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.20.0.254
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::fe
        actions:
          allow: 1

    # Blokkeer verkeer naar medegasten (VLAN 20)
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.20.0.0/22
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::/64
        actions:
          allow: 0

    # Blokkeer verkeer naar Personeel (VLAN 10) en Beheer (VLAN 30)
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.10.0.0/22
        actions:
          allow: 0
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.30.0.0/24
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:10::/64
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:30::/64
        actions:
          allow: 0

    # Uitgaand naar ISP A: Rate Limit meter én NAT translatie
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.1
        actions:
          meter: guest_limit
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.2
              range_ipv4_max: 203.0.113.2

    # Uitgaand naar ISP B: Rate Limit meter én NAT translatie
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.17
        actions:
          meter: guest_limit
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.18
              range_ipv4_max: 203.0.113.18

    # Overig uitgaand verkeer (IPv6 naar WAN) limiteren via meter
    - rule:
        actions:
          meter: guest_limit
          allow: 1

  # ==========================================================
  # 3. INTERNE NAT & CONNTRACK REGELS (Access poorten)
  # ==========================================================
  NAT:
    # ARP en NDP altijd doorlaten
    - rule:
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # Inter-VLAN verkeer intern routeren
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 10.0.0.0/8
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8::/32
        actions:
          allow: 1

    # IPv6 Conntrack tracking
    - rule:
        eth_type: 0x86dd
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0

    - rule:
        eth_type: 0x86dd
        ct_state: 0x21/0x21
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1

    - rule:
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # IPv4 Conntrack tracking
    - rule:
        eth_type: 0x0800
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0

    # Nieuwe verbindingen naar ISP A natten
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.1
        ct_state: 0x21/0x21
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.2
              range_ipv4_max: 203.0.113.2

    # Nieuwe verbindingen naar ISP B natten
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.17
        ct_state: 0x21/0x21
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.18
              range_ipv4_max: 203.0.113.18

    # Terugkerend verkeer de-natten
    - rule:
        eth_type: 0x0800
        ct_zone: 1
        ct_state: 0x22/0x22
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1

  # ==========================================================
  # 4. STATEFUL WAN FIREWALL (Uplinks naar ISP's op sA0/sB0)
  # ==========================================================
  wan_firewall:
    # 1. ARP en ICMPv6 NDP altijd toestaan voor router peering
    - rule:
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # 2. IPv6 Stateful Firewall:
    # Antwoorden op onze uitgaande ICMPv6 pings (Echo Reply = 129)
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 129
        actions:
          allow: 1

    # Terugkerende TCP/UDP sessies die van binnenuit gestart zijn
    - rule:
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # Blokkeer alle ongevraagde inkomende verbindingen/pings vanaf WAN
    - rule:
        eth_type: 0x86dd
        actions:
          allow: 0

    # 3. IPv4 Stateful Firewall:
    # Stuur inkomend IPv4 WAN-verkeer door conntrack de-natting
    - rule:
        eth_type: 0x0800
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 1
            nat: {}

    # Laat alleen gerelateerd / antwoord-verkeer toe
    - rule:
        eth_type: 0x0800
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # Blokkeer ongevraagd verkeer van WAN naar binnen
    - rule:
        eth_type: 0x0800
        actions:
          allow: 0
