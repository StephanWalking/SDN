# ==========================================================
# /etc/faucet/acls.yaml
# ==========================================================

meters:
  # NFV 1: Rate Limiter (10 Mbps met realistische burst bucket)
  guest_limit:
    meter_id: 1
    entry:
      flags: [KBPS, BURST]
      bands:
        - type: DROP
          rate: 10000
          burst_size: 1200

acls:
  # ==========================================================
  # 1. MANAGEMENT PORT SECURITY & ISOLATIE (sB2: poort 2)
  # ==========================================================
  mgmt_portsec:
    # NFV 2: ARP & NDP alleen toestaan voor geautoriseerd MAC-adres
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # Gateway VIPs expliciet toestaan voor L3 routering
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 10.30.0.254
        actions:
          allow: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:30::fe
        actions:
          allow: 1

    # Netwerkscheiding: Beheer mag NIET naar Employee of Gasten
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 10.10.0.0/22
        actions:
          allow: 0
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 10.20.0.0/22
        actions:
          allow: 0
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:10::/64
        actions:
          allow: 0
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::/64
        actions:
          allow: 0

    # ICMPv6 Echo Request / Reply toestaan voor pings naar buiten
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 128
        actions:
          allow: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 129
        actions:
          allow: 1

    # IPv6 Stateful Conntrack Tracking naar WAN
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ct_state: 0x21/0x21
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # IPv4 Conntrack Tracking
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0

    # IPv4 NAPT naar ISP A (/28 publieke pool)
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 203.0.113.1
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.2
              range_ipv4_max: 203.0.113.2

    # IPv4 NAPT naar ISP B (/28 publieke pool)
    - rule:
        eth_src: "00:00:00:00:00:05"
        eth_type: 0x0800
        ipv4_dst: 203.0.113.17
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.18
              range_ipv4_max: 203.0.113.18

    # Lokaal verkeer binnen eigen Management VLAN 30 toestaan
    - rule:
        eth_src: "00:00:00:00:00:05"
        actions:
          allow: 1

    # Port Security Default: Blokkeer elk ander MAC-adres op poort 2
    - rule:
        actions:
          allow: 0

  # ==========================================================
  # 2. GASTENBEVEILIGING (sA2/sB3: Isolatie + Rate Limit + Conntrack)
  # ==========================================================
  guest_isolation:
    # 1. ARP en ICMPv6 NDP toestaan voor L2/L3 resolving
    - rule:
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # 2. Lokale Gateways (VIPs) expliciet toestaan voor routeringsresolutie
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.20.0.254
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::fe
        actions:
          allow: 1

    # 3. MICRO-SEGMENTATIE: Gasten onderling strikt blokkeren (Private VLAN)
    # Staat BOVEN de algemene echo/verkeersregels zodat gast-pings direct vallen
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.20.0.0/22
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::/64
        actions:
          allow: 0

    # 4. NETWERKSCHEIDING: Gasten mogen NIET naar Employee of Beheer
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.10.0.0/22
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:10::/64
        actions:
          allow: 0
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.30.0.0/24
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:30::/64
        actions:
          allow: 0

    # 5. ICMPv6 Echo Request / Reply naar buiten (WAN) toestaan + limiteren
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 128
        actions:
          meter: guest_limit
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 129
        actions:
          meter: guest_limit
          allow: 1

    # 6. IPv6 Stateful Tracking + Rate Limiting naar WAN
    - rule:
        eth_type: 0x86dd
        ct_state: 0/0x20
        actions:
          meter: guest_limit
          ct:
            zone: 1
            table: 0
    - rule:
        eth_type: 0x86dd
        ct_state: 0x21/0x21
        actions:
          meter: guest_limit
          ct:
            zone: 1
            flags: 1
            table: 1
    - rule:
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          meter: guest_limit
          allow: 1

    # 7. IPv4 Conntrack Tracking
    - rule:
        eth_type: 0x0800
        ct_state: 0/0x20
        actions:
          meter: guest_limit
          ct:
            zone: 1
            table: 0

    # 8. IPv4 NAPT + Rate Limiting naar ISP A
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.1
        actions:
          meter: guest_limit
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.2
              range_ipv4_max: 203.0.113.2

    # 9. IPv4 NAPT + Rate Limiting naar ISP B
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.17
        actions:
          meter: guest_limit
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.18
              range_ipv4_max: 203.0.113.18

    # Fallback drop
    - rule:
        actions:
          allow: 0

  # ==========================================================
  # 3. INTERNE NAT & SCHEIDING (sA1/sB1: Employee poorten)
  # ==========================================================
  NAT:
    # ARP en NDP altijd doorlaten
    - rule:
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # Gateway VIPs expliciet toestaan voor L3 routering
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.10.0.254
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:10::fe
        actions:
          allow: 1

    # Netwerkscheiding: Employee mag NIET naar Beheer (VLAN 30) of Gasten (VLAN 20)
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.30.0.0/24
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:30::/64
        actions:
          allow: 0
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.20.0.0/22
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:20::/64
        actions:
          allow: 0

    # Lokaal inter-host verkeer binnen Employee (VLAN 10) toestaan
    - rule:
        eth_type: 0x0800
        ipv4_dst: 10.10.0.0/22
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ipv6_dst: 2001:db8:10::/64
        actions:
          allow: 1

    # ICMPv6 Echo Request / Reply toestaan voor pings naar buiten
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 128
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 129
        actions:
          allow: 1

    # IPv6 Stateful Conntrack Tracking naar WAN
    - rule:
        eth_type: 0x86dd
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0
    - rule:
        eth_type: 0x86dd
        ct_state: 0x21/0x21
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
    - rule:
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # IPv4 Conntrack tracking
    - rule:
        eth_type: 0x0800
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0

    # IPv4 NAPT naar ISP A
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.1
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.2
              range_ipv4_max: 203.0.113.2

    # IPv4 NAPT naar ISP B
    - rule:
        eth_type: 0x0800
        ipv4_src: 10.0.0.0/8
        ipv4_dst: 203.0.113.17
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1
              range_ipv4_min: 203.0.113.18
              range_ipv4_max: 203.0.113.18

    # Terugkerend verkeer de-natten
    - rule:
        eth_type: 0x0800
        ct_zone: 1
        ct_state: 0x22/0x22
        actions:
          ct:
            zone: 1
            flags: 1
            table: 1
            nat:
              flags: 1

  # ==========================================================
  # 4. STATEFUL WAN FIREWALL (sA0/sB0: poort 1 naar ISP's)
  # ==========================================================
  wan_firewall:
    # Peering ARP en NDP doorlaten
    - rule:
        eth_type: 0x0806
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          allow: 1

    # IPv6 Inkomend: Conntrack sessiecontrole (recirculeren naar table 0)
    - rule:
        eth_type: 0x86dd
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0

    # IPv6 Inkomend: Alleen antwoorden op gevestigde sessies (+est+trk) doorlaten
    - rule:
        eth_type: 0x86dd
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # IPv6 Inkomend: Echo reply expliciet toestaan
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 129
        actions:
          allow: 1

    # IPv6: Blokkeer alle ongevraagde inkomende verbindingen vanaf internet
    - rule:
        eth_type: 0x86dd
        actions:
          allow: 0

    # IPv4 Inkomend: Conntrack inspectie & de-nat (recirculeren naar table 0)
    - rule:
        eth_type: 0x0800
        ct_state: 0/0x20
        actions:
          ct:
            zone: 1
            table: 0
            nat: {}

    # IPv4 Inkomend: Alleen antwoordverkeer (+est+trk) doorlaten
    - rule:
        eth_type: 0x0800
        ct_state: 0x22/0x22
        actions:
          allow: 1

    # IPv4: Blokkeer alle ongevraagde inkomende verbindingen vanaf internet
    - rule:
        eth_type: 0x0800
        actions:
          allow: 0
