# FAUCET METERS & ACLS
# Wordt ook gebruikt vanuit /etc/faucet/faucet.yaml

# --- 1. METERS (Rate Limiting) ---
meters:
  guest_limit:
    meter_id: 1
    entry:
      flags: "KBPS"
      bands:
        - type: "DROP"
          rate: 10000          # Begrenst gastverkeer op max 10.000 kbps (10 Mbps)

# --- 2. ACL'S ---
acls:
  # GAST-ISOLATIE (Studenten mogen niet bij elkaar en niet bij interne subnetten)
  guest_isolation_and_ratelimit:
    # 1. ARP en ICMPv6 Neighbor Discovery (NDP) naar de router toestaan met rate limiting
    - rule:
        eth_type: 0x0806
        actions:
          meter: guest_limit
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 135
        actions:
          meter: guest_limit
          allow: 1
    - rule:
        eth_type: 0x86dd
        ip_proto: 58
        icmpv6_type: 136
        actions:
          meter: guest_limit
          allow: 1

    # 2. Blokkeer alle pakketten gericht aan andere gasten in hetzelfde subnet (VLAN 20)
    - rule:
        eth_type: 0x0800
        ipv4_dst: "10.20.0.0/22"
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: "2001:db8:20::/64"
        actions:
          allow: 0

    # 3. Blokkeer intern verkeer naar Employee (VLAN 10)
    - rule:
        eth_type: 0x0800
        ipv4_dst: "10.10.0.0/22"
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: "2001:db8:10::/64"
        actions:
          allow: 0

    # 4. Blokkeer intern verkeer naar Management (VLAN 30)
    - rule:
        eth_type: 0x0800
        ipv4_dst: "10.30.0.0/24"
        actions:
          allow: 0
    - rule:
        eth_type: 0x86dd
        ipv6_dst: "2001:db8:30::/64"
        actions:
          allow: 0

    # 5. Sta alleen verkeer toe gericht aan Gateway Gebouw A of Gateway Gebouw B
    - rule:
        eth_dst: "00:00:00:00:aa:20"
        actions:
          meter: guest_limit
          allow: 1
    - rule:
        eth_dst: "00:00:00:00:bb:20"
        actions:
          meter: guest_limit
          allow: 1

    # 6. Default Deny: al het overige verkeer blokkeren
    - rule:
        actions:
          allow: 0

  # MANAGEMENT PORT SECURITY (L2 Whitelisting)
  mgmt_portsec:
    - rule:
        eth_src: "00:00:00:00:00:05"     # Alleen hB2
        actions:
          allow: 1
    - rule:
        actions:
          allow: 0
