include:
  - acls.yaml

vlans:
  employee:
    vid: 10
    description: "Personeelsnetwerk"
    faucet_vips: ["10.10.0.254/22", "2001:db8:10::fe/64"]
    faucet_mac: "00:00:00:00:ff:10"

  guest:
    vid: 20
    description: "Gastennetwerk"
    faucet_vips: ["10.20.0.254/22", "2001:db8:20::fe/64"]
    faucet_mac: "00:00:00:00:ff:20"

  mgmt:
    vid: 30
    description: "Beheernetwerk"
    faucet_vips: ["10.30.0.254/24", "2001:db8:30::fe/64"]
    faucet_mac: "00:00:00:00:ff:30"

  vlan_isp:
    vid: 100
    description: "WAN ISP Peering"
    faucet_vips: ["203.0.113.2/28", "2001:db8:a::2/64", "203.0.113.18/28", "2001:db8:b::2/64"]
    faucet_mac: "00:00:00:00:ff:90"

routers:
  router_isp:
    vlans: [employee, guest, mgmt, vlan_isp]

dps:
  # ================= GEBOUW A =================
  sA0:
    dp_id: 0x1
    hardware: "Open vSwitch"
    stack:
      priority: 1
    interfaces:
      1:
        description: "Uplink ISP A"
        native_vlan: vlan_isp
        acls_in: [wan_firewall]
      2:
        description: "Stack naar sA1"
        stack: {dp: sA1, port: 1}
      3:
        description: "Stack naar sA2"
        stack: {dp: sA2, port: 1}
      4:
        description: "Darkfiber stack naar sB0"
        stack: {dp: sB0, port: 5}

  sA1:
    dp_id: 0x2
    hardware: "Open vSwitch"
    interfaces:
      1:
        description: "Stack naar sA0"
        stack: {dp: sA0, port: 2}
      2:
        description: "Host hA1 (Employee)"
        native_vlan: employee
        acls_in: [NAT]

  sA2:
    dp_id: 0x3
    hardware: "Open vSwitch"
    interfaces:
      1:
        description: "Stack naar sA0"
        stack: {dp: sA0, port: 3}
      2:
        description: "Host hA2 (Gast)"
        native_vlan: guest
        acls_in: [guest_isolation, NAT]

  # ================= GEBOUW B =================
  sB0:
    dp_id: 0x11
    hardware: "Open vSwitch"
    stack:
      priority: 2
    interfaces:
      1:
        description: "Uplink ISP B"
        native_vlan: vlan_isp
        acls_in: [wan_firewall]
      2:
        description: "Stack naar sB1"
        stack: {dp: sB1, port: 1}
      3:
        description: "Stack naar sB2"
        stack: {dp: sB2, port: 1}
      4:
        description: "Stack naar sB3"
        stack: {dp: sB3, port: 1}
      5:
        description: "Darkfiber stack naar sA0"
        stack: {dp: sA0, port: 4}

  sB1:
    dp_id: 0x12
    hardware: "Open vSwitch"
    interfaces:
      1:
        description: "Stack naar sB0"
        stack: {dp: sB0, port: 2}
      2:
        description: "Host hB1 (Employee)"
        native_vlan: employee
        acls_in: [NAT]

  sB2:
    dp_id: 0x13
    hardware: "Open vSwitch"
    interfaces:
      1:
        description: "Stack naar sB0"
        stack: {dp: sB0, port: 3}
      2:
        description: "Host hB2 (Management)"
        native_vlan: mgmt
        acls_in: [mgmt_portsec, NAT]

  sB3:
    dp_id: 0x14
    hardware: "Open vSwitch"
    interfaces:
      1:
        description: "Stack naar sB0"
        stack: {dp: sB0, port: 4}
      2:
        description: "Host hB3 (Gast)"
        native_vlan: guest
        acls_in: [guest_isolation, NAT]
